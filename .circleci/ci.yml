version: 2.1

parameters:
  build_core:
    type: boolean
    default: false
  build_mock:
    type: boolean
    default: false
  build_sql:
    type: boolean
    default: false
  build_redis:
    type: boolean
    default: false
  build_bull:
    type: boolean
    default: false
  build_pg_kysely:
    type: boolean
    default: false
  build_pg_knex:
    type: boolean
    default: false
  build_pg_sequelize:
    type: boolean
    default: false
  build_pglite_driver:
    type: boolean
    default: false
  build_s3:
    type: boolean
    default: false
  build_sqs:
    type: boolean
    default: false
  build_kafka:
    type: boolean
    default: false
  build_mysql:
    type: boolean
    default: false
  build_workspace:
    type: boolean
    default: false
  build_grpc_client:
    type: boolean
    default: false

orbs:
  vn-ci: versatile/vn-ci@1
  node: circleci/node@7.2.1

jobs:
  workspace-check:
    executor:
      name: vn-ci/machine
      docker_layer_caching: false
    resource_class: large.gen2
    steps:
      - checkout
      - node/install
      - node/install-packages
      - run:
          name: Root check
          command: npm run check

  grpc-client-check:
    executor:
      name: vn-ci/machine
      docker_layer_caching: false
    resource_class: large.gen2
    steps:
      - checkout
      - node/install
      - node/install-packages
      - run:
          name: Build core (grpc-client has no pretest; tests import @vnatures/test-kit from dist)
          command: npm run build --workspace=@vnatures/test-kit
      - run:
          name: Lint grpc-client
          command: npm run lint
          working_directory: examples/grpc-client
      - run:
          name: Typecheck grpc-client
          command: npm run typecheck
          working_directory: examples/grpc-client
      - run:
          name: Test grpc-client
          command: npm run test
          working_directory: examples/grpc-client

workflows:
  core:
    when: <<pipeline.parameters.build_core>>
    jobs:
      - vn-ci/init:
          context: base-context
          is_default_branch: <<pipeline.git.branch.is_default>>
          package_json_dir: "packages/core"
      - vn-ci/build-publish:
          context: base-context
          is_default_branch: <<pipeline.git.branch.is_default>>
          requires:
            - vn-ci/init
          filters:
            branches:
              only: main
  mock:
    when: <<pipeline.parameters.build_mock>>
    jobs:
      - vn-ci/init:
