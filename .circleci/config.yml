version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0
  vn-ci: versatile/vn-ci@1

workflows:
  init:
    jobs:
      - path-filtering/filter:
          name: check changes
          base-revision: main
          config-path: .circleci/ci.yml
          mapping: |
            packages/core/.* build_core true
            packages/pglite-driver/.* build_pglite_driver true
            packages/mock/.* build_mock true
            packages/sql/.* build_sql true
            packages/redis/.* build_redis true
            packages/bull/.* build_bull true
            packages/s3/.* build_s3 true
            packages/sqs/.* build_sqs true
            packages/kafka/.* build_kafka true
            packages/mysql/.* build_mysql true
            packages/pg-kysely/.* build_pg_kysely true
            packages/pg-knex/.* build_pg_knex true
            packages/pg-sequelize/.* build_pg_sequelize true
            package\.json build_workspace true
            tsconfig\.json build_workspace true
            tsconfig\.base\.json build_workspace true
            \.eslintrc\.json build_workspace true
            vitest\.workspace\.ts build_workspace true
            docs/.* build_workspace true
            \.circleci/.* build_workspace true
            \.cursor/.* build_workspace true
            \.claude/.* build_workspace true
            \.harness/.* build_workspace true
            \.opencode/.* build_workspace true
            examples/grpc-client/.* build_grpc_client true

  backup:
    jobs:
      - vn-ci/backup-code:
          context: base-context
          filters:
            branches:
              only: [main]

  audit:
    jobs:
      - vn-ci/npm-audit:
          context: base-context
          filters:
            branches:
              only: [main]
