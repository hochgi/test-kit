version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0
  vn-ci: versatile/vn-ci@0.0.31

workflows:
  init:
    jobs:
      - path-filtering/filter:
          name: check changes
          base-revision: main
          config-path: .circleci/ci.yml
          mapping: |
            packages/core/.* build_core true
            packages/redis/.* build_redis true

  backup:
    jobs:
      - vn-ci/backup-code:
          context: base-context
          filters:
            branches:
              only: [main]

  audit:
    jobs:
      - vn-ci/npm-audit:
          context: base-context
          filters:
            branches:
              only: [main]
